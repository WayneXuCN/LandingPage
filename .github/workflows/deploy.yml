name: 构建与部署

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: production

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 浅克隆，提高速度

      - name: 服务器执行部署命令
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e  # 遇到错误立即退出
            cd /opt/1panel/www/sites/wenjiexusite/LandingPage

            # 设置代理加速
            git remote set-url origin https://gh.xmly.dev/https://github.com/Vncntvx/LandingPage

            # 拉取最新代码
            git config --global --add safe.directory "$(pwd)"
            git fetch --all --depth=1
            git reset --hard origin/main
            git pull --depth=1

            # 设置 PATH 环境变量以包含 bun
            export PATH="/root/.bun/bin:$PATH"

            # 验证 bun 是否可用
            which bun || echo "bun not found in PATH"

            # 安装依赖并构建
            bun install
            bun run build

            # 将 dist 文件夹内容移动到 index 目录
            rm -rf /opt/1panel/www/sites/wenjiexusite/index/*
            cp -r dist/* /opt/1panel/www/sites/wenjiexusite/index/

            # 设置index文件权限为 PHP-FPM 用户
            chown -R 1000:1000 /opt/1panel/www/sites/wenjiexusite/index

            echo "✅ 构建文件已移动到 index 目录"
            echo "✅ index 目录文件权限已设置为 1000:1000"
            echo "🚀 部署完成时间: $(date)"
